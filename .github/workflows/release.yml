name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: bash scripts/package-release.sh

      - name: Verify tag matches the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^PIXIED_VERSION="\([^"]*\)"/\1/p' bin/pixied | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the packaged version v$version" >&2
            echo "bump PIXIED_VERSION in bin/pixied or create the tag with scripts/tag-release.sh" >&2
            exit 1
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/pixied.tar.gz dist/pixied.tar.gz.sha256 --clobber
