# Development container service definition.
# Build context is the project root. The workspace is bind-mounted from the
# host. The project Pixi directory is kept on a per-user named volume declared
# in devcontainer.json mounts instead of here, because docker compose cannot
# interpolate devcontainer variables. The container sleeps by default; project
# installation runs via the post-create command.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
